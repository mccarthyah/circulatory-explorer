name: Godot tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Download and verify Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/4.7.2-stable
          archive=Godot_v4.7.2-stable_linux.x86_64.zip
          curl -fL --retry 3 "$base/$archive" -o "$archive"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  $archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
      - name: Validate anatomy assets and embedded credits
        run: |
          python3 tests/validate_assets.py
          python3 pipeline/sync_credits.py --check
      - name: Import and run headless tests
        env:
          GODOT: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_linux.x86_64
        shell: bash
        run: |
          set -o pipefail
          ./tests/run.sh 2>&1 | tee "$RUNNER_TEMP/headless.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ] || grep -qE '(SCRIPT ERROR|ERROR:|FAIL:)' "$RUNNER_TEMP/headless.log"; then
            echo "::error::Headless tests exited with code $result"
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 30 "$RUNNER_TEMP/headless.log")
            exit 1
          fi
      - name: Verify credits inside exported pack
        shell: bash
        env:
          GODOT: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_linux.x86_64
        run: |
          set -euo pipefail
          trap 'rm -f "$GITHUB_WORKSPACE/export_presets.cfg"' EXIT
          cat > export_presets.cfg <<'PRESET'
          [preset.0]
          name="Credits pack test"
          platform="Linux/X11"
          runnable=true
          export_filter="all_resources"
          include_filter="tests/export_credits.gd"
          exclude_filter=""
          export_path=""
          script_export_mode=1
          PRESET
          "$GODOT" --headless --path . --export-pack "Credits pack test" "$RUNNER_TEMP/credits.pck"
          mkdir -p "$RUNNER_TEMP/pack-test"
          cd "$RUNNER_TEMP/pack-test"
          "$GODOT" --headless --path . --main-pack "$RUNNER_TEMP/credits.pck" --script res://tests/export_credits.gd 2>&1 | tee "$RUNNER_TEMP/export.log"
          if grep -qE '(SCRIPT ERROR|ERROR:|FAIL:)' "$RUNNER_TEMP/export.log" || ! grep -q 'PASS: exported pack displays embedded attribution' "$RUNNER_TEMP/export.log"; then
            echo "::error::Exported attribution test failed"
            exit 1
          fi
      - name: Default Compatibility renderer smoke test (Mesa software OpenGL)
        shell: bash
        env:
          GODOT: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_linux.x86_64
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          export XDG_DATA_HOME="$(mktemp -d)" LIBGL_ALWAYS_SOFTWARE=1
          export EXPLORER_SETTINGS_PATH="$XDG_DATA_HOME/settings.cfg"
          set +e
          xvfb-run -a "$GODOT" --verbose --audio-driver Dummy --disable-vsync --path . --resolution 1280x720 --script res://tests/render_smoke.gd 2>&1 | tee "$RUNNER_TEMP/render.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ] || grep -qE '(SCRIPT ERROR|ERROR:|SHADER ERROR|FAIL:)' "$RUNNER_TEMP/render.log"; then
            echo "::error::Renderer smoke exited with code $result"
            while IFS= read -r line; do echo "::error::$line"; done < <(grep -E "(SCRIPT ERROR|ERROR:|SHADER ERROR|FAIL:| at: )" "$RUNNER_TEMP/render.log" | tail -n 8)
            exit 1
          fi
      - name: Exercise benchmark on software OpenGL
        shell: bash
        env:
          GODOT: ${{ runner.temp }}/godot/Godot_v4.7.2-stable_linux.x86_64
          BENCH_WARMUP: '0.2'
          BENCH_DURATION: '0.5'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          xvfb-run -a ./tests/benchmark.sh performance --audio-driver Dummy --disable-vsync --resolution 800x600 2>&1 | tee "$RUNNER_TEMP/bench.log"
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ] || grep -qE '(SCRIPT ERROR|ERROR:|SHADER ERROR)' "$RUNNER_TEMP/bench.log" || [ "$(grep -c 'BENCHMARK view=' "$RUNNER_TEMP/bench.log")" -ne 4 ]; then
            echo "::error::Benchmark smoke exited with code $result"
            while IFS= read -r line; do echo "::error::$line"; done < <(tail -n 30 "$RUNNER_TEMP/bench.log")
            exit 1
          fi
